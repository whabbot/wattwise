<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family:'IBM Plex Sans', sans-serif; background:#F5F5F4; }
  .card { background:#fff; border:1px solid #E7E5E4; border-radius:12px; padding:20px; box-shadow: 0 1px 2px rgba(20,33,50,.04); }
  .eyebrow { font-size:13px; font-weight:500; color:#64748B; margin-bottom:8px; }
  .metric { font-size:32px; line-height:36px; font-weight:600; color:#142132; font-feature-settings:'tnum'; letter-spacing:-0.01em; }
  .delta { font-size:13px; font-weight:500; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:500; }
  .chip .dot { width:6px; height:6px; border-radius:999px; }
  .footer { margin-top:14px; padding-top:12px; border-top:1px solid #F5F5F4; font-size:13px; }
  .footer a { color:#0F766E; text-decoration:none; font-weight:500; }
</style></head>
<body>
<div style="padding:20px; background:#F5F5F4">
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
    <div class="card">
      <div class="eyebrow">Energy score</div>
      <div style="display:flex; align-items:baseline; gap:10px"><span class="metric">72</span><span class="delta" style="color:#15803D">▲ 4 pts</span></div>
      <div style="font-size:13px; color:#334155; margin-top:8px">Your peak-hour use dropped 11% versus last month.</div>
      <div class="footer"><a href="#">View score breakdown →</a></div>
    </div>
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px">
        <div class="eyebrow" style="margin:0">Standing charge</div>
        <span class="chip" style="background:#FFF1F2; color:#B91C1C"><span class="dot" style="background:#DC2626"></span>Anomaly</span>
      </div>
      <div style="display:flex; align-items:baseline; gap:10px"><span class="metric pv-mono" style="font-family:'IBM Plex Mono'">£0.61</span><span class="delta" style="color:#DC2626">▲ 27%</span></div>
      <div style="font-size:13px; color:#334155; margin-top:8px">Increased above your usual range on 18 Apr.</div>
      <div class="footer"><a href="#">Review the bill →</a></div>
    </div>
  </div>
</div>
</body></html>
