<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { font-family:'IBM Plex Sans', sans-serif; }
  .btn { display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 14px; border-radius:10px; font-size:14px; font-weight:500; border:1px solid transparent; cursor:pointer; font-family:inherit; }
  .btn-sm { height:30px; padding:0 12px; font-size:13px; }
  .btn-lg { height:44px; padding:0 18px; font-size:15px; }
  .btn-primary { background:#0F766E; color:#fff; }
  .btn-secondary { background:#fff; color:#142132; border-color:#D6D3D1; }
  .btn-tertiary { background:transparent; color:#0F766E; }
  .btn-danger { background:#DC2626; color:#fff; }
  .btn-danger-outline { background:#fff; color:#B91C1C; border-color:#FECACA; }
</style>
</head>
<body>
<div class="pv-pad">
  <div class="pv-label" style="margin-bottom:14px">Buttons · variants &amp; sizes</div>
  <div style="display:flex; gap:10px; align-items:center; margin-bottom:14px">
    <button class="btn btn-primary">Save changes</button>
    <button class="btn btn-secondary">Cancel</button>
    <button class="btn btn-tertiary">Learn more</button>
    <button class="btn btn-danger">Delete tariff</button>
    <button class="btn btn-danger-outline">Remove</button>
  </div>
  <div style="display:flex; gap:10px; align-items:center;">
    <button class="btn btn-primary btn-sm">Small</button>
    <button class="btn btn-primary">Medium</button>
    <button class="btn btn-primary btn-lg">Large</button>
  </div>
  <div class="pv-tiny" style="margin-top:14px; font-size:11px; color:#64748B">One primary per panel · destructive never shares styling with primary CTA</div>
</div>
</body></html>
