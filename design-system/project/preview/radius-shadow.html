<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css"></head>
<body>
<div class="pv-pad">
  <div class="pv-label" style="margin-bottom:14px">Radius &amp; shadow · restrained, structural</div>
  <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:18px; margin-bottom:18px">
    <div style="text-align:center">
      <div style="height:64px; background:#FFFFFF; border:1px solid #E7E5E4; border-radius:12px;"></div>
      <div class="pv-name" style="margin-top:10px">Card · 12px</div>
      <div class="pv-tiny">Document-like, soft</div>
    </div>
    <div style="text-align:center">
      <div style="height:40px; background:#FFFFFF; border:1px solid #E7E5E4; border-radius:10px; margin-top:12px"></div>
      <div class="pv-name" style="margin-top:10px">Input/button · 10px</div>
      <div class="pv-tiny">Tappable but crisp</div>
    </div>
    <div style="text-align:center">
      <div style="display:inline-block; padding:6px 14px; background:#F0FDFA; color:#0F766E; border-radius:999px; font-size:13px; font-weight:500; margin-top:18px">Healthy</div>
      <div class="pv-name" style="margin-top:14px">Pill · 999px</div>
      <div class="pv-tiny">Capsule chips only</div>
    </div>
  </div>
  <div class="pv-label" style="margin:14px 0 10px">Shadows</div>
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:18px;">
    <div>
      <div style="height:48px; background:#FFFFFF; border:1px solid #E7E5E4; border-radius:12px; box-shadow: 0 1px 2px rgba(20,33,50,0.04), 0 1px 1px rgba(20,33,50,0.03);"></div>
      <div class="pv-name" style="margin-top:8px">card</div>
      <div class="pv-hex">0 1px 2px rgba(20,33,50,.04)</div>
    </div>
    <div>
      <div style="height:48px; background:#FFFFFF; border:1px solid #E7E5E4; border-radius:12px; box-shadow: 0 4px 12px rgba(20,33,50,0.08), 0 1px 3px rgba(20,33,50,0.06);"></div>
      <div class="pv-name" style="margin-top:8px">popover</div>
      <div class="pv-hex">0 4px 12px rgba(20,33,50,.08)</div>
    </div>
  </div>
</div>
</body></html>
