<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family:'IBM Plex Sans', sans-serif; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead th { font-size:12px; font-weight:500; color:#64748B; text-align:left; padding:8px 12px; background:#F5F5F4; border-bottom:1px solid #E7E5E4; }
  thead th.num { text-align:right; }
  tbody td { padding:10px 12px; border-bottom:1px solid #F5F5F4; color:#142132; }
  tbody td.num { text-align:right; font-family:'IBM Plex Mono', monospace; font-feature-settings:'tnum'; }
  tbody tr:hover { background:#FAFAF9; }
  .chip { display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:500; }
</style></head>
<body>
<div class="pv-pad" style="padding:14px">
  <div class="pv-label" style="margin-bottom:10px; padding:0 4px">Tables · sticky headers, right-aligned numerics, sortable, density-toggle</div>
  <div style="border:1px solid #E7E5E4; border-radius:12px; overflow:hidden; background:#fff;">
    <table>
      <thead><tr>
        <th>Tariff</th><th>Type</th><th class="num">Unit rate</th><th class="num">Annual cost</th><th>Confidence</th>
      </tr></thead>
      <tbody>
        <tr><td>British Gas Standard</td><td style="color:#64748B">Variable</td><td class="num">29.84 p/kWh</td><td class="num">£3,142</td><td><span class="chip" style="background:#EFF6FF; color:#2563EB">Exact</span></td></tr>
        <tr><td>Octopus Agile</td><td style="color:#64748B">Half-hourly</td><td class="num">23.10 p/kWh</td><td class="num">£2,694</td><td><span class="chip" style="background:#FFFBEB; color:#B45309">Estimated</span></td></tr>
        <tr><td>EDF Fix 12M</td><td style="color:#64748B">Fixed</td><td class="num">28.42 p/kWh</td><td class="num">£2,847</td><td><span class="chip" style="background:#EFF6FF; color:#2563EB">Exact</span></td></tr>
        <tr><td>SME peer median</td><td style="color:#64748B">—</td><td class="num">28.10 p/kWh</td><td class="num">£2,810</td><td><span class="chip" style="background:#F5F5F4; color:#334155">Benchmark</span></td></tr>
      </tbody>
    </table>
  </div>
</div>
</body></html>
