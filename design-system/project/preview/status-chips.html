<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { font-family:'IBM Plex Sans', sans-serif; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:500; }
  .dot { width:6px; height:6px; border-radius:999px; }
</style></head>
<body>
<div class="pv-pad">
  <div class="pv-label" style="margin-bottom:14px">Status chips · the trust model, made visible</div>
  <div style="display:flex; flex-wrap:wrap; gap:10px;">
    <span class="chip" style="background:#EFF6FF; color:#2563EB"><span class="dot" style="background:#2563EB"></span>Exact</span>
    <span class="chip" style="background:#FFFBEB; color:#B45309"><span class="dot" style="background:#D97706"></span>Estimated</span>
    <span class="chip" style="background:#F5F5F4; color:#334155"><span class="dot" style="background:#64748B"></span>Benchmark</span>
    <span class="chip" style="background:#FFF1F2; color:#B91C1C"><span class="dot" style="background:#DC2626"></span>Anomaly</span>
    <span class="chip" style="background:#FFFBEB; color:#B45309"><span class="dot" style="background:#D97706"></span>Review</span>
    <span class="chip" style="background:#F0FDF4; color:#15803D"><span class="dot" style="background:#15803D"></span>Healthy</span>
  </div>
  <div class="pv-tiny" style="margin-top:18px; font-size:11px; color:#64748B">Always paired with text in tables, banners and metric cards. Color is never the only signal.</div>
</div>
</body></html>
